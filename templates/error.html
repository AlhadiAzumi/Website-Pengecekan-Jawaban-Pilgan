{% extends "base.html" %}
{% block title %}Error {{ code }} &middot; {{ app_title }}{% endblock %}
{% block content %}
<div class="card">
  <div class="card-body text-center py-5">
    <div class="display-1 fw-bold text-primary mb-2">{{ code }}</div>
    <p class="lead text-muted mb-4">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Kembali ke Dashboard</a>
  </div>
</div>
{% endblock %}
