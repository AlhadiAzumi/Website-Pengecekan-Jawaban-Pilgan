{% extends "base.html" %}
{% block title %}{{ title }} &middot; {{ app_title }}{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>{{ title }}</h1>
    <p class="lead">{{ message }}</p>
  </div>
</div>
<div class="card">
  <div class="card-body text-center py-5">
    <i class="bi bi-tools display-4 text-muted d-block mb-3"></i>
    <p class="text-muted mb-0">Tahap ini akan segera tersedia.</p>
  </div>
</div>
{% endblock %}
